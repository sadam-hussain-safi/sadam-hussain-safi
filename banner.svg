      .cmd { font: 500 13px 'Consolas', 'Courier New', monospace; fill: #334155; }
      .name { font: 800 38px 'Segoe UI', system-ui, sans-serif; fill: #0F172A; letter-spacing: -0.5px; }
      .role { font: 600 16px 'Segoe UI', system-ui, sans-serif; fill: #0284C7; }
      .meta { font: 500 13px 'Segoe UI', system-ui, sans-serif; fill: #334155; }
      .pillText { font: 600 11px 'Segoe UI', system-ui, sans-serif; fill: #1E293B; }
      .footerLabel { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .footerVal { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #0F172A; }
      .tagRight { font: 700 10px 'Segoe UI', system-ui, sans-serif; fill: #475569; letter-spacing: 0.8px; }
      .ascii { font: 600 8px 'Consolas', monospace; fill: #0284C7; }
