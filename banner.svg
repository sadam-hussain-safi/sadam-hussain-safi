<svg width="960" height="440" viewBox="0 0 960 440" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="600" y1="90" x2="860" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="accentBorder" x1="30" y1="20" x2="930" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    
    <!-- Circular Clipping Mask for Your Photo -->
    <clipPath id="photoClip">
      <circle cx="745" cy="215" r="105"/>
    </clipPath>

    <style>
      .domain { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #0284C7; letter-spacing: 1.2px; }
      .tagRight { font: 700 10px 'Segoe UI', system-ui, sans-serif; fill: #64748B; letter-spacing: 1px; }
      .cmd { font: 500 13px 'Consolas', 'Courier New', monospace; fill: #334155; }
      .name { font: 800 38px 'Segoe UI', system-ui, sans-serif; fill: #0F172A; letter-spacing: -0.5px; }
      .role { font: 600 16px 'Segoe UI', system-ui, sans-serif; fill: #0284C7; }
      .meta { font: 500 13px 'Segoe UI', system-ui, sans-serif; fill: #475569; }
      .pillText { font: 600 11px 'Segoe UI', system-ui, sans-serif; fill: #1E293B; }
      .footerLabel { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #64748B; }
      .footerVal { font: 500 11px 'Segoe UI', system-ui, sans-serif; fill: #0F172A; }
    </style>
  </defs>

  <!-- Card Background & Border Frame -->
  <rect width="960" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect x="28" y="20" width="904" height="400" rx="20" stroke="url(#accentBorder)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Top Domain & Label -->
  <text x="58" y="52" class="domain">SADAM-HUSSAIN-SAFI.GITHUB.IO</text>
  <text x="545" y="52" class="tagRight">VERIFIED PORTRAIT • ELECTRIC DESIGN</text>

  <!-- Terminal Command Box -->
  <rect x="58" y="70" width="410" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="74" y="93" class="cmd">$ build --frontend --backend --ai-engineer</text>

  <!-- Name & Professional Title -->
  <text x="58" y="156" class="name">Sadam Hussain Safi</text>
  <text x="58" y="186" class="role">Frontend Developer, Backend Developer &amp; AI Engineer</text>
  <text x="58" y="210" class="meta">Lahore, Pakistan  |  Founder &amp; CEO at Aria Tech Solutions</text>
  <text x="58" y="232" class="meta">Full-stack web systems, REST APIs, AI models &amp; robust architectures</text>

  <!-- Skill Pill Badges -->
  <rect x="58" y="254" width="78" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="97" y="270" text-anchor="middle" class="pillText">Frontend</text>
  <rect x="142" y="254" width="76" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="180" y="270" text-anchor="middle" class="pillText">Backend</text>
  <rect x="224" y="254" width="92" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="270" y="270" text-anchor="middle" class="pillText">AI Engineer</text>
  <rect x="322" y="254" width="76" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="360" y="270" text-anchor="middle" class="pillText">TypeScript</text>
  <rect x="404" y="254" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="440" y="270" text-anchor="middle" class="pillText">Node.js</text>
  <rect x="482" y="254" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="518" y="270" text-anchor="middle" class="pillText">Python</text>

  <rect x="58" y="286" width="74" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="95" y="302" text-anchor="middle" class="pillText">React</text>
  <rect x="138" y="286" width="78" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="177" y="302" text-anchor="middle" class="pillText">Next.js</text>
  <rect x="222" y="286" width="74" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="259" y="302" text-anchor="middle" class="pillText">Flutter</text>
  <rect x="302" y="286" width="90" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="347" y="302" text-anchor="middle" class="pillText">Transformers</text>
  <rect x="402" y="286" width="72" height="24" rx="12" fill="#FFFFFF" stroke="#94A3B8"/><text x="438" y="302" text-anchor="middle" class="pillText">SQLite</text>

  <!-- Footer Links & Socials -->
  <text x="58" y="354" class="footerLabel">PORTFOLIO:</text>
  <text x="134" y="354" class="footerVal">sadam-hussain-dev.netlify.app</text>
  
  <text x="58" y="380" class="footerLabel">SOCIAL:</text>
  <text x="120" y="380" class="footerVal">LinkedIn / GitHub / X @sadam-hussain-safi</text>

  <!-- Right Side Glowing Electric Ring & Embedded Original Portrait Photo -->
  <circle cx="745" cy="215" r="122" fill="url(#ringGrad)" opacity="0.2"/>
  <circle cx="745" cy="215" r="112" fill="#FFFFFF" stroke="url(#ringGrad)" stroke-width="4"/>
  
  <!-- Your Original Photo Clipped to Circle (Looking for profile.jpg or profile.png) -->
  <image x="635" y="105" width="220" height="220" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" xlink:href="./profile.jpg" />
  
  <text x="745" y="364" text-anchor="middle" class="tagRight">SADAM HUSSAIN SAFI • VERIFIED</text>
</svg>
